name: Claude PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summary:
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'claude[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate PR Summary
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false
          use_sticky_comment: false
          claude_args: '--model haiku --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*)"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Generate a concise technical summary for this PR.

            **Repository contains:**
            - `src/` - Solidity smart contracts (security-critical)
            - `script/` - Foundry deployment scripts (Solidity)
            - `script/migration/` - Off-chain TypeScript scripts (Merkle trees, snapshots, batch operations)
            - `test/` - Foundry tests
            - `web3-functions/` - TypeScript automation

            **STEP 1: Gather Information**

            ```bash
            gh pr view ${{ github.event.pull_request.number }} --json title,body,files,additions,deletions
            ```

            ```bash
            gh pr diff ${{ github.event.pull_request.number }}
            ```

            **STEP 2: Analyze Changes**

            Assess:
            - Contract modifications (new functions, state changes, modifiers)
            - Security-relevant changes (access control, fund handling, external calls)
            - Upgrade implications (storage layout, initializers)
            - Breaking changes (interface modifications, removed functions)

            Complexity:
            - Simple: <100 lines, single contract
            - Medium: 100-300 lines, multiple files
            - Complex: >300 lines, cross-contract changes

            **STEP 3: Generate Summary (max 150 words)**

            ```
            ## PR Summary

            **Generated:** [date]

            ### Overview
            [2-3 sentences: what and why]

            ### Key Changes
            - [Main change 1]
            - [Main change 2]
            - [Main change 3]

            ### Impact Assessment
            - **Files Changed**: [number]
            - **Lines**: +[additions] -[deletions]
            - **Contracts Affected**: [list]
            - **Security-Relevant**: [Yes/No - brief note if yes]
            - **Breaking Changes**: [Yes/No]

            ### Technical Assessment
            - **Complexity**: [Simple/Medium/Complex]
            - **Risk Level**: [Low/Medium/High]
            - **Upgrade Safety**: [N/A or assessment]

            ---
            *For detailed security review, comment `/review` on this PR*
            ```

            **STEP 4: Update PR Description**

            ```bash
            CURRENT_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body')

            if echo "$CURRENT_BODY" | grep -q "<!-- CLAUDE_SUMMARY_START -->"; then
              CLEAN_BODY=$(echo "$CURRENT_BODY" | perl -0777 -pe 's/<!-- CLAUDE_SUMMARY_START -->.*?<!-- CLAUDE_SUMMARY_END -->//gs')
            else
              CLEAN_BODY="$CURRENT_BODY"
            fi

            cat > /tmp/pr_body.txt << 'EOFBODY'
            $CLEAN_BODY

            ---

            <!-- CLAUDE_SUMMARY_START -->
            [Your generated summary]
            <!-- CLAUDE_SUMMARY_END -->
            EOFBODY

            gh pr edit ${{ github.event.pull_request.number }} --body-file /tmp/pr_body.txt
            ```

            **Guidelines:**
            - Focus on WHAT changed, not code review
            - Highlight security-relevant modifications
            - Note upgrade implications for proxy contracts
            - Keep it technical and concise
